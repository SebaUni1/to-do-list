<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple and professional interactive to-do list.">
  <title>2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-card" aria-labelledby="page-title">
    <header class="todo-header">
      <p class="eyebrow">Stay organized</p>
      <h1 id="page-title">My To-Do List</h1>
      <p class="intro">Keep track of what needs to get done.</p>
    </header>

    <form class="task-form" id="task-form">
      <label class="sr-only" for="task-input">Enter a new task</label>
      <input
        id="task-input"
        name="task"
        type="text"
        placeholder="What needs to be done?"
        maxlength="200"
        autocomplete="off"
        required
      >
      <button class="add-button" type="submit">Add Task</button>
    </form>

    <section class="task-section" aria-labelledby="tasks-heading">
      <div class="task-summary">
        <h2 id="tasks-heading">Your tasks</h2>
        <p id="task-count" aria-live="polite">0 tasks remaining</p>
      </div>

      <p class="empty-state" id="empty-state">You have no tasks yet. Add one to get started.</p>
      <ul class="task-list" id="task-list" aria-label="To-do tasks"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
